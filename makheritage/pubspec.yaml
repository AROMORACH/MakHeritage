name: makheritage
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.4
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_dotenv: ^6.0.1
  shared_preferences: ^2.5.5
  geolocator: ^13.0.1
  flutter_local_notifications: ^18.0.0
  flutter_tts: ^4.2.5
  flutter_compass: ^0.8.1
  flutter_foreground_task: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/data/
    - assets/data/landmarks_pictures/
    - assets/images/
    - .env